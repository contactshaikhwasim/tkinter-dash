name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Install Linux GUI test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Run tests on Windows/macOS
        if: runner.os != 'Linux'
        run: python -m pytest

      - name: Run example smoke tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for example in examples/0*.py; do
            echo "Running $example"
            TKINTER_DASH_SMOKE=1 xvfb-run -a python "$example"
          done

      - name: Run example smoke tests on Windows/macOS
        if: runner.os != 'Linux'
        shell: bash
        run: |
          for example in examples/0*.py; do
            echo "Running $example"
            python "$example" &
            pid=$!
            sleep 2
            kill "$pid" 2>/dev/null || true
          done

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m pip install dist/*.whl && python -c "import tkinter_dash; print(tkinter_dash.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Install package
        run: python -m pip install .

      - name: Build Sphinx documentation
        run: sphinx-build -W -b html docs docs/_build/html
