# Builds the sdist + wheel on every push/PR and creates a GitHub Release
# (with the built distributions attached) when a `v*` tag is pushed.
name: CI

on:
  push:
  pull_request:

# Least privilege by default; the `release` job opts into `contents: write`.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # TEMPORARILY DISABLED while the test suite is being reworked.
  # To re-enable: uncomment the `test` job below and restore `needs: test`
  # on the `build` job.
  # ---------------------------------------------------------------------------
  # test:
  #   timeout-minutes: 5
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       os: [ubuntu-latest, windows-latest, macos-latest]
  #       python-version: ["3.9", "3.12", "3.13"]
  #   runs-on: ${{ matrix.os }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ matrix.python-version }}
  #     - name: Install Tk dependencies (Ubuntu)
  #       if: runner.os == 'Linux'
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y python3-tk xvfb
  #     - name: Install package and test dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         python -m pip install -e ".[test]"
  #     - name: Run tests (Linux/Xvfb)
  #       if: runner.os == 'Linux'
  #       run: xvfb-run -a python -m pytest -q
  #     - name: Run tests (Windows/macOS)
  #       if: runner.os != 'Linux'
  #       run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    # needs: test  # re-enable together with the `test` job above
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  # ---------------------------------------------------------------------------
  # GitHub Release: runs only for `v*` tags, e.g. `git tag v0.1.5 && git push
  # origin v0.1.5`. Reuses the distributions produced by the `build` job.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ### tkinter-dash ${{ github.ref_name }}

          Packaging, documentation and release-infrastructure release. No breaking API changes.

          #### Highlights

          - Added the MIT `LICENSE` file to the wheel and source distribution.
          - Richer PyPI metadata: author email and Homepage / Repository / Issues URLs.
          - Consolidated CI into a single workflow that builds the sdist + wheel, runs
            `twine check`, and attaches both to this release on every `v*` tag.
          - Fixed the theme-toggle example to use the documented `configure_theme()` API.
          - Fixed the CI badge URL.

          #### Install

          ```bash
          pip install --upgrade tkinter-dash
          ```
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz \
            --title "tkinter-dash ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
