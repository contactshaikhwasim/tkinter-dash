# Publishes the sdist + wheel to PyPI using trusted publishing (OIDC, no API token).
#
# The PyPI publisher must be configured with EXACTLY:
#   Repository       : contactshaikhwasim/tkinter-dash
#   Workflow name    : python-publish.yml
#   Environment name : pypi
# Renaming this file, or the `pypi` environment, breaks publishing: PyPI would
# answer with `invalid-publisher`.
#
# Note: this workflow is NOT triggered by `release: published`, because the
# release created by release.yml uses the repository GITHUB_TOKEN and GitHub
# suppresses workflow runs caused by that token. Release tags are used instead.

name: Upload Python Package

on:
  # Automatic publishing: `git tag v0.1.6 && git push origin v0.1.6`
  push:
    tags: ["v*"]
  # Manual publishing of whatever version the selected branch/tag contains:
  # Actions -> Upload Python Package -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/tkinter-dash

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/